apiVersion: v1
kind: LimitRange
metadata:
  name: restorio-defaults
spec:
  limits:
    - type: Container
      default:
        cpu: "2"
        memory: 2Gi
      defaultRequest:
        cpu: 200m
        memory: 256Mi
      max:
        cpu: "4"
        memory: 6Gi
      min:
        cpu: 25m
        memory: 32Mi
