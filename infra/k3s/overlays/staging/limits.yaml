apiVersion: v1
kind: LimitRange
metadata:
  name: restorio-defaults
spec:
  limits:
    - type: Container
      default:
        cpu: "1"
        memory: 1Gi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: "2"
        memory: 3Gi
      min:
        cpu: 25m
        memory: 32Mi
