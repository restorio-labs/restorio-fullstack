name: Create Release Tag

on:
  workflow_call:
    inputs:
      bump:
        description: Version increment
        required: true
        type: string
      source_ref:
        description: Main commit or branch to tag
        required: true
        type: string
    outputs:
      tag:
        description: Created vMAJOR.MINOR.PATCH tag
        value: ${{ jobs.create-tag.outputs.tag }}

concurrency:
  group: create-release-tag-main
  cancel-in-progress: false

permissions:
  attestations: write
  contents: write
  id-token: write
  packages: write
  security-events: write

jobs:
  create-tag:
    name: Create release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Calculate next release tag
        id: release
        shell: bash
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
        run: |
          set -euo pipefail

          latest_tag=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -n 1)
          if [ -z "$latest_tag" ]; then
            if [ "$BUMP" != initial ]; then
              echo "::error::The first release must use the initial bump"
              exit 1
            fi

            version=$(jq -r '.version' package.json)
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::package.json version is not valid SemVer: $version"
              exit 1
            fi
            next_tag="v$version"
          else
            if [ "$BUMP" = initial ]; then
              echo "::error::The initial bump can only create the first release tag"
              exit 1
            fi

            IFS='.' read -r major minor patch <<< "${latest_tag#v}"
            case "$BUMP" in
              patch)
                patch=$((patch + 1))
                ;;
              minor)
                minor=$((minor + 1))
                patch=0
                ;;
              major)
                major=$((major + 1))
                minor=0
                patch=0
                ;;
            esac
            next_tag="v$major.$minor.$patch"
          fi

          if git rev-parse --verify --quiet "refs/tags/$next_tag" >/dev/null; then
            echo "::error::Release tag already exists: $next_tag"
            exit 1
          fi

          printf 'tag=%s\n' "$next_tag" >> "$GITHUB_OUTPUT"

      - name: Create annotated tag
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag --annotate "$RELEASE_TAG" --message "Release $RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Write release summary
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          publish_workflow_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/publish-oci-images.yml"
          preview_k3s_workflow_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/deploy-preview-k3s.yml"
          vinext_workflow_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/deploy-vinext-frontend.yml"

          {
            echo "## Release tag created"
            echo
            echo "- Tag: \`$RELEASE_TAG\`"
            echo "- Commit: \`$(git rev-parse HEAD)\`"
            echo
            echo "1. [Publish Release OCI Images]($publish_workflow_url) starts automatically for \`$RELEASE_TAG\`."
            echo "2. After it succeeds, run [Deploy preview to k3s]($preview_k3s_workflow_url) from \`$RELEASE_TAG\`."
            echo "3. Then run [Deploy Vinext Frontend]($vinext_workflow_url) from \`$RELEASE_TAG\` for \`preview\`."
          } >> "$GITHUB_STEP_SUMMARY"
