name: Create Release Tag

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment
        required: true
        default: patch
        type: choice
        options:
          - initial
          - patch
          - minor
          - major

concurrency:
  group: create-release-tag-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  create-tag:
    name: Create release tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
          fetch-depth: 0

      - name: Calculate next release tag
        id: release
        shell: bash
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
        run: |
          set -euo pipefail

          latest_tag=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -n 1)
          if [ -z "$latest_tag" ]; then
            if [ "$BUMP" != initial ]; then
              echo "::error::The first release must use the initial bump"
              exit 1
            fi

            version=$(jq -r '.version' package.json)
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::package.json version is not valid SemVer: $version"
              exit 1
            fi
            next_tag="v$version"
          else
            if [ "$BUMP" = initial ]; then
              echo "::error::The initial bump can only create the first release tag"
              exit 1
            fi

            IFS='.' read -r major minor patch <<< "${latest_tag#v}"
            case "$BUMP" in
              patch)
                patch=$((patch + 1))
                ;;
              minor)
                minor=$((minor + 1))
                patch=0
                ;;
              major)
                major=$((major + 1))
                minor=0
                patch=0
                ;;
            esac
            next_tag="v$major.$minor.$patch"
          fi

          if git rev-parse --verify --quiet "refs/tags/$next_tag" >/dev/null; then
            echo "::error::Release tag already exists: $next_tag"
            exit 1
          fi

          printf 'tag=%s\n' "$next_tag" >> "$GITHUB_OUTPUT"

      - name: Create annotated tag
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag --annotate "$RELEASE_TAG" --message "Release $RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Write release summary
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          {
            echo "## Release tag created"
            echo
            echo "- Tag: \`$RELEASE_TAG\`"
            echo "- Commit: \`$(git rev-parse HEAD)\`"
            echo
            echo "Run Publish OCI Images and Deploy to k3s from the \`$RELEASE_TAG\` ref."
          } >> "$GITHUB_STEP_SUMMARY"
