name: Deploy preview to k3s

on:
  workflow_dispatch:

concurrency:
  group: deploy-preview-k3s
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: Deploy release to preview
    runs-on: ubuntu-latest
    environment: preview
    env:
      DEPLOY_SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
      DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT || '22' }}
      DEPLOY_SSH_USER: restorio-deploy
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_SSH_KNOWN_HOSTS: ${{ vars.DEPLOY_SSH_KNOWN_HOSTS }}
      GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
      PREVIEW_BASIC_AUTH_USERNAME: ${{ secrets.PREVIEW_BASIC_AUTH_USERNAME }}
      PREVIEW_BASIC_AUTH_PASSWORD: ${{ secrets.PREVIEW_BASIC_AUTH_PASSWORD }}
    steps:
      - name: Validate selected release
        shell: bash
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ "$RELEASE_REF" != refs/tags/* ]]; then
            echo "::error::Deploy preview to k3s must run from a release tag"
            exit 1
          fi

          if ! [[ "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected release tag vMAJOR.MINOR.PATCH, got: $RELEASE_VERSION"
            exit 1
          fi

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [ -n "${DEPLOY_SSH_HOST:-}" ] || missing+=(DEPLOY_SSH_HOST)
          [ -n "${DEPLOY_SSH_PRIVATE_KEY:-}" ] || missing+=(DEPLOY_SSH_PRIVATE_KEY)
          [ -n "${DEPLOY_SSH_KNOWN_HOSTS:-}" ] || missing+=(DEPLOY_SSH_KNOWN_HOSTS)
          [ -n "${GHCR_PULL_TOKEN:-}" ] || missing+=(GHCR_PULL_TOKEN)
          [ -n "${PREVIEW_BASIC_AUTH_USERNAME:-}" ] || missing+=(PREVIEW_BASIC_AUTH_USERNAME)
          [ -n "${PREVIEW_BASIC_AUTH_PASSWORD:-}" ] || missing+=(PREVIEW_BASIC_AUTH_PASSWORD)
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::Missing GitHub Environment configuration: ${missing[*]}"
            exit 1
          fi

      - name: Checkout selected release
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Resolve release commit
        id: release
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          RELEASE_COMMIT=$(git rev-parse "$RELEASE_VERSION^{commit}")
          printf 'commit=%s\n' "$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Read immutable release manifest
        id: images
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          manifest_path="$RUNNER_TEMP/restorio-release-manifest.json"
          gh release download "$RELEASE_VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern restorio-release-manifest.json \
            --dir "$RUNNER_TEMP"

          release_commit=$(git rev-parse "$RELEASE_VERSION^{commit}")
          jq --exit-status \
            --arg release_tag "$RELEASE_VERSION" \
            --arg commit "$release_commit" \
            '.schemaVersion == 1 and .releaseTag == $release_tag and .commit == $commit and (.components | length) == 5' \
            "$manifest_path" > /dev/null

          read_component() {
            jq --raw-output --exit-status \
              --arg component "$1" \
              '.components[$component] | select(.image and .tag and (.digest | test("^sha256:[0-9a-f]{64}$"))) | "\(.tag) \(.digest)"' \
              "$manifest_path"
          }

          resolved_api=$(read_component api)
          read -r API_TAG API_DIGEST <<< "$resolved_api"
          resolved_admin_panel=$(read_component admin-panel)
          read -r ADMIN_PANEL_TAG ADMIN_PANEL_DIGEST <<< "$resolved_admin_panel"
          resolved_kitchen_panel=$(read_component kitchen-panel)
          read -r KITCHEN_PANEL_TAG KITCHEN_PANEL_DIGEST <<< "$resolved_kitchen_panel"
          resolved_mobile_app=$(read_component mobile-app)
          read -r MOBILE_APP_TAG MOBILE_APP_DIGEST <<< "$resolved_mobile_app"
          resolved_waiter_panel=$(read_component waiter-panel)
          read -r WAITER_PANEL_TAG WAITER_PANEL_DIGEST <<< "$resolved_waiter_panel"
          printf 'api=%s\n' "$API_DIGEST" >> "$GITHUB_OUTPUT"
          printf 'api_tag=%s\n' "$API_TAG" >> "$GITHUB_OUTPUT"
          printf 'admin_panel=%s\n' "$ADMIN_PANEL_DIGEST" >> "$GITHUB_OUTPUT"
          printf 'admin_panel_tag=%s\n' "$ADMIN_PANEL_TAG" >> "$GITHUB_OUTPUT"
          printf 'kitchen_panel=%s\n' "$KITCHEN_PANEL_DIGEST" >> "$GITHUB_OUTPUT"
          printf 'kitchen_panel_tag=%s\n' "$KITCHEN_PANEL_TAG" >> "$GITHUB_OUTPUT"
          printf 'mobile_app=%s\n' "$MOBILE_APP_DIGEST" >> "$GITHUB_OUTPUT"
          printf 'mobile_app_tag=%s\n' "$MOBILE_APP_TAG" >> "$GITHUB_OUTPUT"
          printf 'waiter_panel=%s\n' "$WAITER_PANEL_DIGEST" >> "$GITHUB_OUTPUT"
          printf 'waiter_panel_tag=%s\n' "$WAITER_PANEL_TAG" >> "$GITHUB_OUTPUT"

      - name: Request deployment from target VPS
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
          API_DIGEST: ${{ steps.images.outputs.api }}
          API_TAG: ${{ steps.images.outputs.api_tag }}
          ADMIN_PANEL_DIGEST: ${{ steps.images.outputs.admin_panel }}
          ADMIN_PANEL_TAG: ${{ steps.images.outputs.admin_panel_tag }}
          KITCHEN_PANEL_DIGEST: ${{ steps.images.outputs.kitchen_panel }}
          KITCHEN_PANEL_TAG: ${{ steps.images.outputs.kitchen_panel_tag }}
          MOBILE_APP_DIGEST: ${{ steps.images.outputs.mobile_app }}
          MOBILE_APP_TAG: ${{ steps.images.outputs.mobile_app_tag }}
          WAITER_PANEL_DIGEST: ${{ steps.images.outputs.waiter_panel }}
          WAITER_PANEL_TAG: ${{ steps.images.outputs.waiter_panel_tag }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 0600 "$RUNNER_TEMP/ssh/id_ed25519"
          trap 'rm -rf "$RUNNER_TEMP/ssh"' EXIT

          ssh_command=(
            ssh
            -i "$RUNNER_TEMP/ssh/id_ed25519" \
            -o BatchMode=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -p "$DEPLOY_SSH_PORT" \
            "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST"
          )

          deployment_command="deploy $RELEASE_VERSION $RELEASE_COMMIT $API_DIGEST $ADMIN_PANEL_DIGEST $KITCHEN_PANEL_DIGEST $MOBILE_APP_DIGEST $WAITER_PANEL_DIGEST"

          printf '%s\n%s\n' "$PREVIEW_BASIC_AUTH_USERNAME" "$PREVIEW_BASIC_AUTH_PASSWORD" | \
            "${ssh_command[@]}" "$deployment_command"

      - name: Write deployment summary
        shell: bash
        env:
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
          API_DIGEST: ${{ steps.images.outputs.api }}
          API_TAG: ${{ steps.images.outputs.api_tag }}
          ADMIN_PANEL_DIGEST: ${{ steps.images.outputs.admin_panel }}
          ADMIN_PANEL_TAG: ${{ steps.images.outputs.admin_panel_tag }}
          KITCHEN_PANEL_DIGEST: ${{ steps.images.outputs.kitchen_panel }}
          KITCHEN_PANEL_TAG: ${{ steps.images.outputs.kitchen_panel_tag }}
          MOBILE_APP_DIGEST: ${{ steps.images.outputs.mobile_app }}
          MOBILE_APP_TAG: ${{ steps.images.outputs.mobile_app_tag }}
          WAITER_PANEL_DIGEST: ${{ steps.images.outputs.waiter_panel }}
          WAITER_PANEL_TAG: ${{ steps.images.outputs.waiter_panel_tag }}
        run: |
          set -euo pipefail
          {
            echo "## k3s deployment"
            echo
            echo "- Environment: \`preview\`"
            echo "- Release: \`${{ github.ref_name }}\`"
            echo "- Commit: \`$RELEASE_COMMIT\`"
            echo "- API: \`$API_TAG\` at \`$API_DIGEST\`"
            echo "- Admin panel: \`$ADMIN_PANEL_TAG\` at \`$ADMIN_PANEL_DIGEST\`"
            echo "- Kitchen panel: \`$KITCHEN_PANEL_TAG\` at \`$KITCHEN_PANEL_DIGEST\`"
            echo "- Mobile app: \`$MOBILE_APP_TAG\` at \`$MOBILE_APP_DIGEST\`"
            echo "- Waiter panel: \`$WAITER_PANEL_TAG\` at \`$WAITER_PANEL_DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
