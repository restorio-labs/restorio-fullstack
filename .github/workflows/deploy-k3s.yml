name: Deploy to k3s

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target GitHub environment
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production

concurrency:
  group: deploy-k3s-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: Deploy release to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      DEPLOY_SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
      DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT || '22' }}
      DEPLOY_SSH_USER: restorio-deploy
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_SSH_KNOWN_HOSTS: ${{ vars.DEPLOY_SSH_KNOWN_HOSTS }}
      GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
    steps:
      - name: Validate selected release
        shell: bash
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ "$RELEASE_REF" != refs/tags/* ]]; then
            echo "::error::Deploy to k3s must run from a release tag"
            exit 1
          fi

          if ! [[ "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected release tag vMAJOR.MINOR.PATCH, got: $RELEASE_VERSION"
            exit 1
          fi

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [ -n "${DEPLOY_SSH_HOST:-}" ] || missing+=(DEPLOY_SSH_HOST)
          [ -n "${DEPLOY_SSH_PRIVATE_KEY:-}" ] || missing+=(DEPLOY_SSH_PRIVATE_KEY)
          [ -n "${DEPLOY_SSH_KNOWN_HOSTS:-}" ] || missing+=(DEPLOY_SSH_KNOWN_HOSTS)
          [ -n "${GHCR_PULL_TOKEN:-}" ] || missing+=(GHCR_PULL_TOKEN)
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::Missing GitHub Environment configuration: ${missing[*]}"
            exit 1
          fi

      - name: Checkout selected release
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Resolve release commit
        id: release
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          RELEASE_COMMIT=$(git rev-parse "$RELEASE_VERSION^{commit}")
          printf 'commit=%s\n' "$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Set up Crane
        uses: imjasonh/setup-crane@v0.4

      - name: Resolve immutable image digests
        id: images
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          GHCR_USERNAME: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_PULL_TOKEN" | crane auth login ghcr.io --username "$GHCR_USERNAME" --password-stdin
          API_DIGEST=$(crane digest "ghcr.io/$GHCR_USERNAME/restorio-api:$RELEASE_VERSION")
          WEB_DIGEST=$(crane digest "ghcr.io/$GHCR_USERNAME/restorio-public-web:$RELEASE_VERSION")
          printf 'api=%s\n' "$API_DIGEST" >> "$GITHUB_OUTPUT"
          printf 'public_web=%s\n' "$WEB_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Request deployment from target VPS
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
          API_DIGEST: ${{ steps.images.outputs.api }}
          WEB_DIGEST: ${{ steps.images.outputs.public_web }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 0600 "$RUNNER_TEMP/ssh/id_ed25519"
          trap 'rm -rf "$RUNNER_TEMP/ssh"' EXIT

          ssh \
            -i "$RUNNER_TEMP/ssh/id_ed25519" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -p "$DEPLOY_SSH_PORT" \
            "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
            "deploy $RELEASE_VERSION $RELEASE_COMMIT $API_DIGEST $WEB_DIGEST"

      - name: Write deployment summary
        shell: bash
        env:
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
          API_DIGEST: ${{ steps.images.outputs.api }}
          WEB_DIGEST: ${{ steps.images.outputs.public_web }}
        run: |
          set -euo pipefail
          {
            echo "## k3s deployment"
            echo
            echo "- Environment: \`${{ inputs.environment }}\`"
            echo "- Release: \`${{ github.ref_name }}\`"
            echo "- Commit: \`$RELEASE_COMMIT\`"
            echo "- API digest: \`$API_DIGEST\`"
            echo "- Public web digest: \`$WEB_DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
