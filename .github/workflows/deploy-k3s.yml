name: Deploy to k3s

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target GitHub environment
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production

concurrency:
  group: deploy-k3s-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: Deploy release to ${{ inputs.environment }}
    runs-on:
      - self-hosted
      - linux
      - restorio-${{ inputs.environment }}
    environment: ${{ inputs.environment }}
    env:
      KUBECONFIG: /etc/restorio-ci/kubeconfig
      GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
      K3S_NAMESPACE: ${{ vars.K3S_NAMESPACE || 'restorio' }}
    steps:
      - name: Validate selected release
        shell: bash
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ "$RELEASE_REF" != refs/tags/* ]]; then
            echo "::error::Deploy to k3s must run from a release tag"
            exit 1
          fi

          if ! [[ "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected release tag vMAJOR.MINOR.PATCH, got: $RELEASE_VERSION"
            exit 1
          fi

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [ -r "$KUBECONFIG" ] || missing+=(local-kubeconfig)
          [ -n "${GHCR_PULL_TOKEN:-}" ] || missing+=(GHCR_PULL_TOKEN)
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::Missing deployment configuration: ${missing[*]}"
            exit 1
          fi

      - name: Checkout selected release
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up Crane
        uses: imjasonh/setup-crane@v0.4

      - name: Verify target cluster access
        shell: bash
        run: |
          set -euo pipefail
          test "$(kubectl auth can-i get deployments --namespace "$K3S_NAMESPACE")" = yes
          test "$(kubectl auth can-i create secrets --namespace "$K3S_NAMESPACE")" = yes

      - name: Create or update GHCR pull secret
        shell: bash
        env:
          GHCR_USERNAME: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          kubectl create secret docker-registry ghcr-pull \
            --namespace "$K3S_NAMESPACE" \
            --docker-server=ghcr.io \
            --docker-username="$GHCR_USERNAME" \
            --docker-password="$GHCR_PULL_TOKEN" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Resolve immutable image digests
        id: images
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          GHCR_USERNAME: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_PULL_TOKEN" | crane auth login ghcr.io --username "$GHCR_USERNAME" --password-stdin
          API_DIGEST=$(crane digest "ghcr.io/$GHCR_USERNAME/restorio-api:$RELEASE_VERSION")
          WEB_DIGEST=$(crane digest "ghcr.io/$GHCR_USERNAME/restorio-public-web:$RELEASE_VERSION")
          printf 'api=%s\n' "$API_DIGEST" >> "$GITHUB_OUTPUT"
          printf 'public_web=%s\n' "$WEB_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Deploy release
        shell: bash
        env:
          API_DIGEST: ${{ steps.images.outputs.api }}
          WEB_DIGEST: ${{ steps.images.outputs.public_web }}
        run: |
          set -euo pipefail
          VALUES_FILE="deploy/helm/restorio/values-${{ inputs.environment }}.yaml"
          if [ ! -f "$VALUES_FILE" ]; then
            VALUES_FILE="deploy/helm/restorio/values.yaml"
          fi

          helm upgrade --install restorio deploy/helm/restorio \
            --namespace "$K3S_NAMESPACE" \
            --values "$VALUES_FILE" \
            --set global.imagePullSecrets[0].name=ghcr-pull \
            --set api.image.digest="$API_DIGEST" \
            --set publicWeb.image.digest="$WEB_DIGEST" \
            --wait \
            --wait-for-jobs \
            --timeout 10m \
            --atomic

      - name: Verify deployed release
        shell: bash
        run: |
          set -euo pipefail
          kubectl rollout status deployment/restorio-restorio-api --namespace "$K3S_NAMESPACE" --timeout=3m
          kubectl get pods,services --namespace "$K3S_NAMESPACE" -l app.kubernetes.io/instance=restorio

      - name: Write deployment summary
        shell: bash
        env:
          API_DIGEST: ${{ steps.images.outputs.api }}
          WEB_DIGEST: ${{ steps.images.outputs.public_web }}
        run: |
          set -euo pipefail
          {
            echo "## k3s deployment"
            echo
            echo "- Environment: \`${{ inputs.environment }}\`"
            echo "- Release: \`${{ github.ref_name }}\`"
            echo "- Namespace: \`$K3S_NAMESPACE\`"
            echo "- API digest: \`$API_DIGEST\`"
            echo "- Public web digest: \`$WEB_DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
