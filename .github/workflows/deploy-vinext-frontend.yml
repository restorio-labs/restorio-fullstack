name: Deploy Vinext Frontend

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment name
        required: true
        type: string
      release_tag:
        description: Published vMAJOR.MINOR.PATCH tag to deploy
        required: true
        type: string
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment name
        required: true
        type: choice
        default: preview
        options:
          - preview
          - production

concurrency:
  group: deploy-vinext-${{ inputs.release_tag || github.ref }}-${{ inputs.environment }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-public-web-cloudflare:
    name: Deploy public-web to Cloudflare
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PREVIEW_BASIC_AUTH_USERNAME: ${{ secrets.PREVIEW_BASIC_AUTH_USERNAME }}
      PREVIEW_BASIC_AUTH_PASSWORD: ${{ secrets.PREVIEW_BASIC_AUTH_PASSWORD }}
      RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
      RELEASE_VERSION: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - name: Validate selected release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ -z "$RELEASE_TAG_INPUT" ] && [[ "$GITHUB_REF" != refs/tags/* ]]; then
            echo "::error::Deploy Vinext Frontend must run from a release tag"
            exit 1
          fi

          if ! [[ "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected release tag vMAJOR.MINOR.PATCH, got: $RELEASE_VERSION"
            exit 1
          fi

          gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null

      - name: Checkout selected release
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.sha }}
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      - name: Build workspace packages
        run: bun run turbo run build --filter='./app/packages/*'

      - name: Validate required Cloudflare secrets
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "Missing required secret CLOUDFLARE_API_TOKEN for environment ${{ inputs.environment }}"
            exit 1
          fi

          if [ "${{ inputs.environment }}" = "preview" ]; then
            [ -n "${PREVIEW_BASIC_AUTH_USERNAME:-}" ] || { echo "Missing PREVIEW_BASIC_AUTH_USERNAME"; exit 1; }
            [ -n "${PREVIEW_BASIC_AUTH_PASSWORD:-}" ] || { echo "Missing PREVIEW_BASIC_AUTH_PASSWORD"; exit 1; }
          fi

      - name: Configure preview authentication
        if: inputs.environment == 'preview'
        working-directory: app/apps/public-web
        run: |
          set -euo pipefail
          printf '%s' "$PREVIEW_BASIC_AUTH_USERNAME" | bunx wrangler secret put PREVIEW_BASIC_AUTH_USERNAME --env preview
          printf '%s' "$PREVIEW_BASIC_AUTH_PASSWORD" | bunx wrangler secret put PREVIEW_BASIC_AUTH_PASSWORD --env preview

      - name: Deploy public-web with vinext/wrangler
        working-directory: app/apps/public-web
        run: |
          set -euo pipefail

          if [ "${{ inputs.environment }}" = "preview" ]; then
            CLOUDFLARE_ENV=preview \
              VITE_ENV=preview \
              NODE_ENV=production \
              VITE_APP_VERSION="$RELEASE_VERSION" \
              bunx vinext deploy --env preview
            exit 0
          fi

          VITE_ENV=production \
            NODE_ENV=production \
            VITE_APP_VERSION="$RELEASE_VERSION" \
            bunx vinext deploy
