name: Validate OCI Images

on:
  pull_request:
    paths:
      - "app/api/**"
      - "app/apps/admin-panel/**"
      - "app/apps/kitchen-panel/**"
      - "app/apps/mobile-app/**"
      - "app/apps/waiter-panel/**"
      - "app/packages/**"
      - ".github/workflows/publish-images.yml"
      - "bun.lock"
      - "package.json"
concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate ${{ matrix.component }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            context: app/api
            dockerfile: app/api/Dockerfile
          - component: admin-panel
            context: .
            dockerfile: app/apps/admin-panel/Dockerfile
          - component: kitchen-panel
            context: .
            dockerfile: app/apps/kitchen-panel/Dockerfile
          - component: mobile-app
            context: .
            dockerfile: app/apps/mobile-app/Dockerfile
          - component: waiter-panel
            context: .
            dockerfile: app/apps/waiter-panel/Dockerfile

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Resolve component metadata
        id: component
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          set -euo pipefail

          if [ "$COMPONENT" = "api" ]; then
            VERSION=$(python -c 'import tomllib; print(tomllib.load(open("app/api/pyproject.toml", "rb"))["project"]["version"])')
          else
            VERSION=$(jq -r .version "app/apps/$COMPONENT/package.json")
          fi

          test -n "$VERSION"
          test "$VERSION" != "null"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/restorio-$COMPONENT" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ steps.component.outputs.image }}
          labels: |
            org.opencontainers.image.created=${{ steps.component.outputs.created }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.component.outputs.version }}
          tags: |
            type=raw,value=${{ steps.component.outputs.version }}
            type=raw,value=sha-${{ github.sha }}

      - name: Build image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          build-args: |
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.component.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          labels: ${{ steps.metadata.outputs.labels }}
          platforms: linux/amd64
          provenance: false
          push: false
          tags: ${{ steps.metadata.outputs.tags }}
