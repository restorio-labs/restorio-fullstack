name: Validate Observability

on:
  pull_request:
    branches:
      - main
    paths:
      - "infrastructure/observability/**"
      - ".github/workflows/validate-observability.yml"

concurrency:
  group: observability-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prometheus:
    name: Prometheus manifests
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v6

      - name: Install Helm
        env:
          HELM_VERSION: v3.20.2
        run: |
          set -euo pipefail
          archive="helm-${HELM_VERSION}-linux-amd64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://get.helm.sh/${archive}" \
            --output "${RUNNER_TEMP}/${archive}"
          curl --fail --location --silent --show-error \
            "https://get.helm.sh/${archive}.sha256sum" \
            --output "${RUNNER_TEMP}/${archive}.sha256sum"
          cd "$RUNNER_TEMP"
          sha256sum --check "${archive}.sha256sum"
          tar --extract --gzip --file "$archive"
          echo "${RUNNER_TEMP}/linux-amd64" >> "$GITHUB_PATH"

      - name: Validate rendered manifests
        run: ./infrastructure/observability/prometheus/validate.sh

  grafana:
