{{- range $frontendKey, $frontend := .Values.staticFrontends }}
{{- if $frontend.enabled }}
{{- if not $frontend.image.digest }}
{{- fail (printf "staticFrontends.%s.image.digest must be set to an immutable OCI digest" $frontendKey) }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "restorio.fullname" $ }}-{{ $frontend.name }}
  labels:
    {{- include "restorio.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $frontend.name }}
spec:
  replicas: {{ $frontend.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "restorio.name" $ }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $frontend.name }}
  template:
    metadata:
      labels:
        {{- include "restorio.labels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $frontend.name }}
    spec:
      {{- with $.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ $frontend.name }}
          image: "{{ $frontend.image.repository }}@{{ $frontend.image.digest }}"
          imagePullPolicy: {{ $frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
          resources:
            {{- toYaml $frontend.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "restorio.fullname" $ }}-{{ $frontend.name }}
  labels:
    {{- include "restorio.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $frontend.name }}
spec:
  type: {{ $frontend.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "restorio.name" $ }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: {{ $frontend.name }}
  ports:
    - name: http
      port: 80
      targetPort: http
      {{- if eq $frontend.service.type "NodePort" }}
      nodePort: {{ $frontend.service.nodePort }}
      {{- end }}
{{- end }}
{{- end }}
