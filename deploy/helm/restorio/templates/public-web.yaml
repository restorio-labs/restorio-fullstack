{{- if .Values.publicWeb.enabled }}
{{- if not .Values.publicWeb.image.digest }}
{{- fail "publicWeb.image.digest must be set to an immutable OCI digest" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "restorio.fullname" . }}-public-web
  labels:
    {{- include "restorio.labels" . | nindent 4 }}
    app.kubernetes.io/component: public-web
spec:
  replicas: {{ .Values.publicWeb.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "restorio.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: public-web
  template:
    metadata:
      labels:
        {{- include "restorio.labels" . | nindent 8 }}
        app.kubernetes.io/component: public-web
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: public-web
          image: "{{ .Values.publicWeb.image.repository }}@{{ .Values.publicWeb.image.digest }}"
          imagePullPolicy: {{ .Values.publicWeb.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          resources:
            {{- toYaml .Values.publicWeb.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "restorio.fullname" . }}-public-web
  labels:
    {{- include "restorio.labels" . | nindent 4 }}
    app.kubernetes.io/component: public-web
spec:
  type: {{ .Values.publicWeb.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "restorio.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: public-web
  ports:
    - name: http
      port: 80
      targetPort: http
      {{- if eq .Values.publicWeb.service.type "NodePort" }}
      nodePort: {{ .Values.publicWeb.service.nodePort }}
      {{- end }}
{{- end }}
