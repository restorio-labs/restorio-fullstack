replicas: 1

rbac:
  create: true
  namespaced: true

serviceAccount:
  create: true
  automountServiceAccountToken: false

automountServiceAccountToken: false

testFramework:
  enabled: false

service:
  enabled: true
  type: ClusterIP

ingress:
  enabled: false

persistence:
  enabled: true
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  size: 5Gi
  finalizers:
    - kubernetes.io/pvc-protection

admin:
  existingSecret: grafana-admin
  userKey: admin-user
  passwordKey: admin-password

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

serviceMonitor:
  enabled: true
  path: /metrics
  labels:
    restorio.io/prometheus: primary

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-kube-prometheus-prometheus.observability.svc.cluster.local:9090
        isDefault: true
        editable: false
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki.observability.svc.cluster.local:3100
        editable: false

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: platform
        orgId: 1
        folder: Platform
        type: file
        disableDeletion: true
        editable: false
        options:
          path: /var/lib/grafana/dashboards/platform

dashboardsConfigMaps:
  platform: grafana-dashboard-platform-overview

grafana.ini:
  analytics:
    check_for_updates: false
  auth:
    disable_login_form: false
    disable_signout_menu: false
  auth.anonymous:
    enabled: false
  security:
    cookie_secure: true
  users:
    allow_org_create: false
    allow_sign_up: false
