apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: loki-storage
  labels:
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/name: loki
    app.kubernetes.io/part-of: observability
    restorio.io/prometheus: primary
spec:
  groups:
    - name: loki-storage
      rules:
        - alert: LokiStorageWarning
          expr: |
            kubelet_volume_stats_used_bytes{namespace="observability",persistentvolumeclaim="storage-loki-0"}
              / kubelet_volume_stats_capacity_bytes{namespace="observability",persistentvolumeclaim="storage-loki-0"} > 0.70
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Loki persistent volume is more than 70 percent full
        - alert: LokiStorageCritical
          expr: |
            kubelet_volume_stats_used_bytes{namespace="observability",persistentvolumeclaim="storage-loki-0"}
              / kubelet_volume_stats_capacity_bytes{namespace="observability",persistentvolumeclaim="storage-loki-0"} > 0.85
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: Loki persistent volume is more than 85 percent full
        - alert: LokiStorageExhaustionRisk
          expr: |
            kubelet_volume_stats_used_bytes{namespace="observability",persistentvolumeclaim="storage-loki-0"}
              / kubelet_volume_stats_capacity_bytes{namespace="observability",persistentvolumeclaim="storage-loki-0"} > 0.95
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Loki persistent volume is more than 95 percent full
