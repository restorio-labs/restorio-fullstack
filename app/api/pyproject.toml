[project]
name = "restorio-api"
version = "0.1.0"
description = "Restorio Platform API - Multi-tenant Restaurant Management"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.139.2",
    "starlette==1.3.1",
    "uvicorn[standard]==0.27.0",
    "pydantic==2.13.3",
    "pydantic-settings==2.1.0",
    "email-validator>=2.0.0",
    "PyJWT[crypto]==2.13.0",
    "passlib[bcrypt]==1.7.4",
    "python-multipart==0.0.31",
    "motor==3.7.1",
    "asyncpg==0.31.0",
    "sqlalchemy[asyncio]==2.0.25",
    "alembic==1.13.1",
    "redis==5.0.1",
    "httpx==0.28.1",
    "bcrypt==5.0.0",
    "resend>=2.0.0",
    "pillow==12.3.0",
    "minio==7.2.15",
]

[project.optional-dependencies]
dev = [
    "httpx2==2.7.0",
    "ruff>=0.1.0",
    "pytest>=9.0.3",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "api", "modules"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude =[".venv"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "T10", # flake8-debugger
    "EM",  # flake8-errmsg
    "ISC", # flake8-implicit-str-concat
    "ICN", # flake8-import-conventions
    "PIE", # flake8-pie
    "T20", # flake8-print
    "PT",  # flake8-pytest-style
    "Q",   # flake8-quotes
    "RSE", # flake8-raise
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "ERA", # eradicate
    "PD",  # pandas-vet
    "PGH", # pygrep-hooks
    "PL",  # pylint
    "TRY", # tryceratops
    "NPY", # numpy
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",  # Long comments and strings are not safely auto-wrapped
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["core", "api", "modules"]
force-sort-within-sections = true

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Public re-exports
"**/alembic/versions/*.py" = ["F401", "I001", "RUF022", "UP007", "UP035"]  # Preserve historical migrations
"core/authorization/dependencies.py" = ["B008"]  # FastAPI dependency defaults
"core/foundation/dependencies.py" = ["B008"]  # FastAPI dependency defaults
"core/foundation/tenant_guard.py" = ["B008"]  # FastAPI dependency defaults
"docs/examples/route_template.py" = ["ARG001", "ERA001"]
"routes/**/*.py" = ["PLR0913", "PLR0917"]  # FastAPI injects route parameters from signatures
"tests/**" = ["ARG001", "PLR0917", "PT019"]  # Fixtures and patch-injected parameters

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
filterwarnings = []
addopts = [
    "--strict-markers",
    "--cov=core",
    "--cov=services",
    "--cov=routes",
    "--cov=main",
    "--cov-report=json:coverage/coverage.json",
    "--cov-report=term",
    "--cov-report=html:coverage/html",
]

[tool.coverage.run]
source = ["core", "services", "routes", "main.py"]
data_file = "coverage/.coverage"
omit = ["*/alembic/*"]

[tool.coverage.report]
fail_under = 95
